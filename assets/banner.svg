<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 48px; fill: url(#title-grad); }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 22px; fill: #94a3b8; }
    .subtext { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 16px; fill: #64748b; }
    .tag { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #38bdf8; letter-spacing: 1.5px; }
  </style>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg-grad)" rx="16"/>

  <!-- Dynamic Background Accents -->
  <g opacity="0.35">
    <circle cx="150" cy="80" r="180" fill="url(#glow-grad)"/>
    <circle cx="1050" cy="220" r="220" fill="url(#glow-grad)"/>
    
    <!-- Network Tracing Lines (Simulating Agent Telemetry) -->
    <path d="M 50 220 Q 200 120 400 200 T 750 150 T 1150 240" fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="8 8">
      <animate attributeName="stroke-dashoffset" from="0" to="-100" dur="20s" repeatCount="indefinite" />
    </path>
    <path d="M 100 80 Q 350 250 650 100 T 1100 120" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 6">
      <animate attributeName="stroke-dashoffset" from="0" to="-100" dur="15s" repeatCount="indefinite" />
    </path>

    <!-- Pulsing Nodes -->
    <circle cx="200" cy="150" r="6" fill="#38bdf8">
      <animate attributeName="r" values="4;8;4" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="400" cy="200" r="6" fill="#818cf8">
      <animate attributeName="r" values="4;8;4" dur="3s" begin="0.7s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" begin="0.7s" repeatCount="indefinite" />
    </circle>
    <circle cx="650" cy="100" r="6" fill="#c084fc">
      <animate attributeName="r" values="4;8;4" dur="3s" begin="1.4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" begin="1.4s" repeatCount="indefinite" />
    </circle>
    <circle cx="900" cy="180" r="6" fill="#38bdf8">
      <animate attributeName="r" values="4;8;4" dur="3s" begin="2.1s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" begin="2.1s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Foreground Content Block -->
  <g transform="translate(80, 0)">
    <!-- Category Tag -->
    <rect x="0" y="55" width="200" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="100" y="73" text-anchor="middle" class="tag">CURATED ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="140" class="title">Awesome AI Agent Monitoring</text>

    <!-- Subtitle -->
    <text x="0" y="185" class="subtitle">Traces, Tool-Call Spans, Multi-Agent Sessions, Evals &amp; Cost Tracking</text>
    <text x="0" y="215" class="subtext">The definitive guide to production observability &amp; health for AI agents</text>

    <!-- Decorative Bottom Bar -->
    <rect x="0" y="250" width="1040" height="2" fill="#334155"/>
    <rect x="0" y="250" width="180" height="2" fill="url(#title-grad)"/>
  </g>
</svg>
